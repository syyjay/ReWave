<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-020 · 批量处理进度 - ReWave</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@200;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>
  .ring {
    width: 132px; height: 132px; border-radius: 50%;
    background: conic-gradient(var(--rw-primary) 0% 68%, rgba(255,255,255,0.07) 68% 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .ring::before {
    content: '';
    position: absolute; inset: 9px;
    border-radius: 50%;
    background: var(--rw-bg-base);
  }
  .ring .val { position: relative; text-align: center; }
  .mini-track { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .mini-track b { display: block; height: 100%; border-radius: 2px; background: var(--rw-primary-gradient); }
</style>
</head>
<body>
<div class="phone">
  <div class="dynamic-island"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="sb-right">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <span class="battery"><b></b></span>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-left"><i class="fa-solid fa-chevron-down t-2 text-[15px] cursor-pointer"></i></div>
    <div class="nav-title">批量转换中</div>
    <div class="nav-right"><span class="text-[13px] t-3">最小化</span></div>
  </div>

  <!-- 总进度 -->
  <div class="flex flex-col items-center mt-4 no-shrink">
    <div class="ring">
      <div class="val">
        <p class="mono" style="font-size:30px;font-weight:700;">68<span class="t-3" style="font-size:15px;">%</span></p>
        <p class="text-[10px] t-4">总进度</p>
      </div>
    </div>
    <p class="mono text-[12px] t-2 mt-4">2 / 3 个文件完成 · 剩余约 <b class="t-brand">5 秒</b></p>
    <div class="flex items-center gap-2 mt-2 px-3">
      <span class="chip chip-info"><i class="fa-solid fa-bolt"></i>GPU 加速已启用</span>
      <span class="chip chip-gray mono">MP3 · 320kbps</span>
    </div>
  </div>

  <!-- 逐文件进度 -->
  <div class="scroll px-6 mt-5 pb-4">
    <p class="section-label mb-2 px-1">逐文件进度</p>
    <div class="card overflow-hidden">
      <div class="px-4 py-3.5">
        <div class="flex items-center gap-3">
          <div class="ib ib-38 g-brand"><i class="fa-solid fa-file-audio"></i></div>
          <div class="flex-1 min-w-0">
            <p class="text-[12px] font-semibold truncate">第42期播客_raw.wav</p>
            <p class="mono text-[9px] t-4 mt-0.5">342.8 MB → 38.6 MB</p>
          </div>
          <i class="fa-solid fa-circle-check t-success text-[15px]"></i>
        </div>
        <div class="mini-track mt-2.5"><b style="width:100%;"></b></div>
      </div>
      <div class="divider mx-4"></div>
      <div class="px-4 py-3.5">
        <div class="flex items-center gap-3">
          <div class="ib ib-38 g-merge"><i class="fa-solid fa-microphone"></i></div>
          <div class="flex-1 min-w-0">
            <p class="text-[12px] font-semibold truncate">采访素材_02.wav</p>
            <p class="mono text-[9px] t-4 mt-0.5">216.5 MB → 24.4 MB</p>
          </div>
          <i class="fa-solid fa-circle-check t-success text-[15px]"></i>
        </div>
        <div class="mini-track mt-2.5"><b style="width:100%;"></b></div>
      </div>
      <div class="divider mx-4"></div>
      <div class="px-4 py-3.5">
        <div class="flex items-center gap-3">
          <div class="ib ib-38 g-compress"><i class="fa-solid fa-headphones"></i></div>
          <div class="flex-1 min-w-0">
            <p class="text-[12px] font-semibold truncate">BGM_night_drive.flac</p>
            <p class="mono text-[9px] t-4 mt-0.5">88.3 MB → 9.9 MB · 剩余 5 秒</p>
          </div>
          <i class="fa-solid fa-spinner fa-spin t-brand text-[14px]"></i>
        </div>
        <div class="mini-track mt-2.5"><b style="width:38%;"></b></div>
      </div>
    </div>

    <!-- 完成后动作 -->
    <div class="card list-row mt-4">
      <span class="text-[13px] font-medium t-2">完成后播放提示音</span>
      <div class="toggle on"></div>
    </div>
    <div class="card list-row mt-2">
      <span class="text-[13px] font-medium t-2">失败时保留源文件</span>
      <div class="toggle on"></div>
    </div>
  </div>

  <div class="no-shrink flex gap-3 px-6 pt-3 pb-7" style="background:linear-gradient(180deg,transparent,var(--rw-bg-base) 30%);">
    <button class="btn btn-secondary flex-1"><i class="fa-solid fa-house text-[13px]"></i>后台运行</button>
    <button class="btn btn-secondary flex-1" style="color:var(--rw-error);"><i class="fa-solid fa-xmark text-[13px]"></i>取消</button>
  </div>
  <div class="home-indicator"></div>
</div>
<script src="assets/common.js"></script>
</body>
</html>
