<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-022 · 帮助与反馈 - ReWave</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@200;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="phone">
  <div class="dynamic-island"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="sb-right">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <span class="battery"><b></b></span>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-left"><span class="nav-back" onclick="location.href='settings.html'"><i class="fa-solid fa-chevron-left"></i>设置</span></div>
    <span class="nav-title">帮助与反馈</span>
    <div class="nav-right"></div>
  </div>

  <div class="scroll px-6 pb-8">
    <!-- 常见问题 -->
    <p class="section-label mt-3 mb-2 px-1">常见问题</p>
    <div class="card overflow-hidden">
      <div class="list-row">
        <span class="text-[13px] font-medium t-2 flex-1">如何批量转换 100+ 个文件？</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
      <div class="divider mx-4"></div>
      <div class="list-row">
        <span class="text-[13px] font-medium t-2 flex-1">AI 降噪每次处理的时长限制？</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
      <div class="divider mx-4"></div>
      <div class="list-row">
        <span class="text-[13px] font-medium t-2 flex-1">导出的铃声如何设置为来电铃声？</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
      <div class="divider mx-4"></div>
      <div class="list-row">
        <span class="text-[13px] font-medium t-2 flex-1">查看全部 24 条常见问题</span>
        <i class="fa-solid fa-chevron-right chev t-brand"></i>
      </div>
    </div>

    <!-- 教程 -->
    <p class="section-label mt-5 mb-2 px-1">新手教程</p>
    <div class="card overflow-hidden">
      <div class="list-row">
        <div class="ib ib-38"><i class="fa-solid fa-scissors"></i></div>
        <div class="flex-1">
          <p class="text-[13px] font-medium t-2">3 分钟学会波形剪辑</p>
          <p class="text-[10px] t-4 mt-0.5">视频 · 03:12</p>
        </div>
        <i class="fa-solid fa-play text-[10px] t-4"></i>
      </div>
      <div class="divider mx-4"></div>
      <div class="list-row">
        <div class="ib ib-38"><i class="fa-solid fa-layer-group"></i></div>
        <div class="flex-1">
          <p class="text-[13px] font-medium t-2">批量处理入门</p>
          <p class="text-[10px] t-4 mt-0.5">视频 · 02:45</p>
        </div>
        <i class="fa-solid fa-play text-[10px] t-4"></i>
      </div>
      <div class="divider mx-4"></div>
      <div class="list-row">
        <div class="ib ib-38"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
        <div class="flex-1">
          <p class="text-[13px] font-medium t-2">AI 降噪与人声分离实战</p>
          <p class="text-[10px] t-4 mt-0.5">视频 · 05:30</p>
        </div>
        <i class="fa-solid fa-play text-[10px] t-4"></i>
      </div>
    </div>

    <!-- 反馈 -->
    <p class="section-label mt-5 mb-2 px-1">反馈与支持</p>
    <div class="card overflow-hidden">
      <div class="list-row">
        <div class="ib ib-32"><i class="fa-solid fa-comment-dots"></i></div>
        <span class="text-[13px] font-medium t-2 flex-1">反馈建议</span>
        <span class="mono text-[11px] t-3">support@rewave.app</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
      <div class="divider mx-4"></div>
      <div class="list-row">
        <div class="ib ib-32"><i class="fa-solid fa-star"></i></div>
        <span class="text-[13px] font-medium t-2 flex-1">给 ReWave 评分</span>
        <span class="text-[11px] t-3">App Store</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>
<script src="assets/common.js"></script>
</body>
</html>
