<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-009 · 导出 - ReWave</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@200;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>
  .fmt-chip {
    padding: 9px 0; border-radius: 10px; text-align: center; cursor: pointer;
    background: var(--rw-surface-1); border: 1px solid var(--rw-border-default);
    font-size: 12px; font-weight: 700; color: var(--rw-text-tertiary);
    position: relative;
  }
  .fmt-chip.active { background: rgba(79,107,255,0.15); border-color: var(--rw-border-brand); color: var(--rw-primary); }
  .fmt-chip .pro-badge { position: absolute; top: -6px; right: -4px; }
</style>
</head>
<body>
<div class="phone">
  <div class="dynamic-island"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="sb-right">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <span class="battery"><b></b></span>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-left"><span class="nav-back" onclick="location.href='editor.html'"><i class="fa-solid fa-chevron-left"></i>编辑</span></div>
    <span class="nav-title">导出</span>
    <div class="nav-right"></div>
  </div>

  <div class="scroll px-6 pb-5">
    <!-- 文件命名 -->
    <p class="section-label mt-2 mb-2">文件名</p>
    <input class="input" value="第42期播客_成品" spellcheck="false">

    <!-- 输出格式 -->
    <p class="section-label mt-5 mb-2">输出格式</p>
    <div class="grid grid-cols-5 gap-2">
      <div class="fmt-chip">MP3</div>
      <div class="fmt-chip">M4A</div>
      <div class="fmt-chip active">WAV</div>
      <div class="fmt-chip">AAC</div>
      <div class="fmt-chip" onclick="rwPro('FLAC 无损导出','Pro 解锁 FLAC / AIFF / OPUS 等格式，最高 192kHz / 32bit。')"><span class="pro-badge">PRO</span>FLAC</div>
    </div>

    <!-- 质量参数 -->
    <p class="section-label mt-5 mb-2">质量参数</p>
    <div class="card overflow-hidden">
      <div class="list-row">
        <span class="text-[13px] font-medium t-2">采样率</span>
        <div class="ml-auto flex gap-1.5">
          <span class="seg" style="min-width:56px;padding:7px 4px;">44.1k</span>
          <span class="seg active" style="min-width:44px;padding:7px 4px;">48k</span>
          <span class="seg" style="min-width:44px;padding:7px 4px;" onclick="rwPro('96kHz 采样率','Pro 支持最高 192kHz / 32bit 导出。')">96k</span>
        </div>
      </div>
      <div class="divider mx-4"></div>
      <div class="list-row">
        <span class="text-[13px] font-medium t-2">位深</span>
        <div class="ml-auto flex gap-1.5">
          <span class="seg" style="min-width:40px;padding:7px 4px;">16</span>
          <span class="seg active" style="min-width:40px;padding:7px 4px;">24</span>
          <span class="seg" style="min-width:40px;padding:7px 4px;" onclick="rwPro('32bit 浮点','Pro 支持最高 192kHz / 32bit 导出。')">32f</span>
        </div>
      </div>
      <div class="divider mx-4"></div>
      <div class="list-row">
        <span class="text-[13px] font-medium t-2">声道</span>
        <div class="ml-auto flex gap-1.5">
          <span class="seg" style="min-width:52px;padding:7px 4px;">单声道</span>
          <span class="seg active" style="min-width:52px;padding:7px 4px;">立体声</span>
        </div>
      </div>
    </div>

    <!-- 预估大小 -->
    <div class="card flex items-center justify-between p-4 mt-4">
      <div class="flex items-center gap-3">
        <div class="ib ib-40 g-info"><i class="fa-solid fa-hard-drive"></i></div>
        <div>
          <p class="text-[13px] font-semibold">预估文件大小</p>
          <p class="text-[10px] t-4 mt-0.5">WAV · 48kHz / 24bit · 立体声</p>
        </div>
      </div>
      <span class="mono text-[15px] font-bold t-brand">128.4 MB</span>
    </div>

    <!-- 更多选项 -->
    <p class="section-label mt-5 mb-2">更多选项</p>
    <div class="card overflow-hidden">
      <div class="list-row">
        <div class="ib ib-32 g-ringtone"><i class="fa-solid fa-bell"></i></div>
        <span class="text-[13px] font-medium t-2 flex-1">同时导出为铃声 (.m4r)</span>
        <div class="toggle"></div>
      </div>
      <div class="divider mx-4"></div>
      <div class="list-row">
        <div class="ib ib-32 g-meta"><i class="fa-solid fa-film"></i></div>
        <span class="text-[13px] font-medium t-2 flex-1">导出项目文件 (.rewave)</span>
        <div class="toggle"></div>
      </div>
    </div>
  </div>

  <div class="no-shrink px-6 pt-3 pb-7" style="background:linear-gradient(180deg,transparent,var(--rw-bg-base) 30%);">
    <button class="btn btn-primary w-full" onclick="startExport()">
      <i class="fa-solid fa-arrow-up-from-bracket text-[14px]"></i>导出并分享
    </button>
    <button class="btn btn-secondary w-full mt-2.5" onclick="startExport()">仅保存到「文件」</button>
  </div>

  <!-- 导出进度 → 完成提示 -->
  <div id="exportOverlay" class="absolute inset-0 z-[95] flex flex-col items-center justify-center px-8" style="background:rgba(6,6,9,0.78);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s;">
    <div id="exProgress" class="w-full max-w-[280px] text-center">
      <div class="ib mx-auto" style="width:64px;height:64px;border-radius:20px;background:var(--rw-surface-2);">
        <i class="fa-solid fa-file-export text-[24px]" style="color:var(--rw-primary);"></i>
      </div>
      <p class="text-[15px] font-bold mt-5">正在导出 WAV…</p>
      <div class="rounded-full overflow-hidden mt-5" style="height:8px;background:rgba(255,255,255,0.08);">
        <div id="exBar" class="h-full rounded-full" style="width:0%;background:var(--rw-primary-gradient);transition:width .3s ease;"></div>
      </div>
      <p class="mono text-[12px] t-3 mt-3"><span id="exPct">0</span>% · 剩余约 3 秒</p>
    </div>
    <div id="exDone" class="w-full max-w-[280px] text-center" style="display:none;">
      <div class="ib g-brand mx-auto" style="width:64px;height:64px;border-radius:20px;box-shadow:var(--rw-shadow-brand);">
        <i class="fa-solid fa-check text-[26px]"></i>
      </div>
      <p class="text-[17px] font-bold mt-5">导出完成</p>
      <p class="mono text-[11px] t-3 mt-1.5">第42期播客_成品.wav · 128.4 MB</p>
      <div class="flex flex-col gap-2.5 mt-6">
        <button class="btn btn-secondary w-full" onclick="location.href='home.html'">打开文件</button>
        <button class="btn btn-secondary w-full" onclick="location.href='editor.html'">继续编辑</button>
        <button class="btn btn-primary w-full" onclick="location.href='home.html'">返回首页</button>
      </div>
    </div>
  </div>

  <script>
    function startExport() {
      var ov = document.getElementById('exportOverlay');
      ov.style.opacity = 1; ov.style.pointerEvents = 'auto';
      document.getElementById('exProgress').style.display = '';
      document.getElementById('exDone').style.display = 'none';
      var bar = document.getElementById('exBar'), pct = document.getElementById('exPct'), v = 0;
      var t = setInterval(function () {
        v = Math.min(100, v + Math.round(6 + Math.random() * 10));
        bar.style.width = v + '%'; pct.textContent = v;
        if (v >= 100) {
          clearInterval(t);
          setTimeout(function () {
            document.getElementById('exProgress').style.display = 'none';
            document.getElementById('exDone').style.display = '';
          }, 350);
        }
      }, 160);
    }
  </script>
  <div class="home-indicator"></div>
</div>
<script src="assets/common.js"></script>
</body>
</html>
