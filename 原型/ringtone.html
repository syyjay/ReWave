<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-017 · 铃声制作 - ReWave</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@200;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="phone">
  <div class="dynamic-island"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="sb-right">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <span class="battery"><b></b></span>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-left"><span class="nav-back"><i class="fa-solid fa-chevron-left"></i>转换</span></div>
    <span class="nav-title">铃声制作</span>
    <div class="nav-right"><i class="fa-solid fa-circle-question t-3 text-[15px] cursor-pointer"></i></div>
  </div>

  <div class="scroll px-6 pb-5">
    <!-- 源文件 -->
    <div class="card-elevated p-4 mt-2 flex items-center gap-3">
      <div class="ib ib-44 g-ringtone"><i class="fa-solid fa-music"></i></div>
      <div class="flex-1 min-w-0">
        <p class="text-[14px] font-semibold truncate">最爱副歌段.flac</p>
        <p class="mono text-[10px] t-3 mt-0.5">03:24 · 48.2 MB · FLAC</p>
      </div>
    </div>

    <!-- 波形裁剪 -->
    <div class="flex items-center justify-between mt-5 mb-2 px-1">
      <span class="section-label">波形裁剪</span>
      <span class="mono text-[10px] t-3"><i class="fa-solid fa-clock mr-1"></i>最长 40 秒</span>
    </div>
    <div class="card p-3">
      <!-- 时间标尺 -->
      <div class="ruler mb-1.5" style="padding:0 2px;">
        <b>0:00</b><b>0:45</b><b>1:30</b><b>2:15</b><b>3:00</b><b>3:24</b>
      </div>
      <div class="rounded-[10px] overflow-hidden relative" style="height:88px;background:var(--rw-surface-1);">
        <div class="wave px-1" data-seed="66" data-bars="76" style="color:var(--rw-primary-300);"></div>
        <!-- 未选区压暗 -->
        <div class="absolute inset-y-0 left-0" style="width:37%;background:rgba(10,10,15,.62);z-index:4;"></div>
        <div class="absolute inset-y-0 right-0" style="width:26.4%;background:rgba(10,10,15,.62);z-index:4;"></div>
        <!-- 选区高亮 -->
        <div class="wave-selection" style="left:37%;width:36.6%;"></div>
        <div class="wave-handle" style="left:calc(37% - 5px);"></div>
        <div class="wave-handle" style="left:calc(73.6% - 5px);"></div>
        <div class="playhead" style="left:45%;"></div>
      </div>
      <!-- 选区信息 -->
      <div class="flex items-center justify-between mt-3">
        <div class="text-center">
          <p class="mono text-[11px] t-2">0:12.5</p>
          <p class="text-[9px] t-4 mt-0.5">起点</p>
        </div>
        <div class="text-center">
          <p class="mono text-[11px] t-brand font-bold">30.0s</p>
          <p class="text-[9px] t-4 mt-0.5">选中时长</p>
        </div>
        <div class="text-center">
          <p class="mono text-[11px] t-2">0:42.5</p>
          <p class="text-[9px] t-4 mt-0.5">终点</p>
        </div>
      </div>
    </div>

    <!-- 淡入淡出 -->
    <p class="section-label mt-5 mb-2">淡入淡出</p>
    <div class="card overflow-hidden">
      <div class="list-row">
        <div class="ib ib-32 g-merge"><i class="fa-solid fa-arrow-trend-up"></i></div>
        <span class="text-[13px] font-medium t-2 flex-1">淡入</span>
        <span class="mono text-[12px] t-3">0.5 秒</span>
        <div class="toggle on ml-3"></div>
      </div>
      <div class="divider mx-4"></div>
      <div class="list-row">
        <div class="ib ib-32 g-merge"><i class="fa-solid fa-arrow-trend-down"></i></div>
        <span class="text-[13px] font-medium t-2 flex-1">淡出</span>
        <span class="mono text-[12px] t-3">1.0 秒</span>
        <div class="toggle on ml-3"></div>
      </div>
    </div>

    <!-- 预览 -->
    <div class="card flex items-center gap-3 p-4 mt-4">
      <div class="ib ib-40 g-ringtone"><i class="fa-solid fa-bell"></i></div>
      <div class="flex-1">
        <p class="text-[13px] font-semibold">预览试听</p>
        <div class="slider mt-2.5">
          <div class="fill" style="width:42%;"></div>
          <div class="thumb" style="left:42%;"></div>
        </div>
      </div>
      <div class="w-10 h-10 rounded-full flex items-center justify-center cursor-pointer" style="background:var(--rw-surface-2);border:1px solid var(--rw-border-default);">
        <i class="fa-solid fa-play text-[11px] t-2 ml-0.5"></i>
      </div>
    </div>
  </div>

  <div class="no-shrink px-6 pt-3 pb-7" style="background:linear-gradient(180deg,transparent,var(--rw-bg-base) 30%);">
    <button class="btn btn-primary w-full">
      <i class="fa-solid fa-bell text-[14px]"></i>导出为铃声 (.m4r)
    </button>
    <p class="text-center text-[10px] t-4 mt-2 leading-relaxed">
      导出后请前往 系统「设置 → 声音与触感 → 电话铃声」选择它
    </p>
  </div>
  <div class="home-indicator"></div>
</div>
<script src="assets/common.js"></script>
</body>
</html>
