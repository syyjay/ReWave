<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-023 · 隐私与条款 - ReWave</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@200;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="phone">
  <div class="dynamic-island"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="sb-right">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <span class="battery"><b></b></span>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-left"><span class="nav-back" onclick="location.href='settings.html'"><i class="fa-solid fa-chevron-left"></i>设置</span></div>
    <span class="nav-title">隐私与条款</span>
    <div class="nav-right"></div>
  </div>

  <div class="scroll px-6 pb-8">
    <!-- 隐私 -->
    <p class="section-label mt-3 mb-2 px-1">隐私</p>
    <div class="card overflow-hidden">
      <div class="list-row">
        <div class="ib ib-32"><i class="fa-solid fa-shield-halved"></i></div>
        <div class="flex-1">
          <p class="text-[13px] font-medium t-2">隐私政策</p>
          <p class="mono text-[10px] t-4 mt-0.5">rewave.app/privacy</p>
        </div>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
      <div class="divider mx-4"></div>
      <div class="list-row">
        <div class="ib ib-32"><i class="fa-solid fa-lock"></i></div>
        <span class="text-[13px] font-medium t-2 flex-1">数据处理说明</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
    </div>

    <div class="card flex items-start gap-3 p-4 mt-3">
      <div class="ib ib-38 mt-0.5"><i class="fa-solid fa-microchip"></i></div>
      <p class="text-[11px] t-3 leading-relaxed">
        ReWave 的 AI 降噪、人声分离等处理<b class="t-2">全部在设备本地完成</b>，音频文件与处理结果不会上传服务器；iCloud 同步仅在你主动开启后生效。
      </p>
    </div>

    <!-- 条款 -->
    <p class="section-label mt-5 mb-2 px-1">条款</p>
    <div class="card overflow-hidden">
      <div class="list-row">
        <div class="ib ib-32"><i class="fa-solid fa-file-contract"></i></div>
        <div class="flex-1">
          <p class="text-[13px] font-medium t-2">使用条款</p>
          <p class="mono text-[10px] t-4 mt-0.5">rewave.app/terms</p>
        </div>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
      <div class="divider mx-4"></div>
      <div class="list-row">
        <div class="ib ib-32"><i class="fa-solid fa-receipt"></i></div>
        <span class="text-[13px] font-medium t-2 flex-1">订阅管理与退款</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
      <div class="divider mx-4"></div>
      <div class="list-row">
        <div class="ib ib-32"><i class="fa-solid fa-code"></i></div>
        <span class="text-[13px] font-medium t-2 flex-1">开源许可</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </div>
    </div>

    <p class="text-center text-[10px] t-4 mt-6">ReWave v1.0.0 · © 2025 ReWave Studio</p>
  </div>
  <div class="home-indicator"></div>
</div>
<script src="assets/common.js"></script>
</body>
</html>
