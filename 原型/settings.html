<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-010 · 设置 - ReWave</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@200;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>
  /* 设置页密度：行高与组间距收紧，保证基本一屏 */
  .list-row { padding: 9px 16px; }
  .grp { margin-top: 10px; }
  .section-label { margin-bottom: 5px; }
</style>
</head>
<body>
<div class="phone">
  <div class="dynamic-island"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="sb-right">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <span class="battery"><b></b></span>
    </div>
  </div>

  <div class="scroll pb-3">
    <div class="page-head"><h1 class="page-title">设置</h1></div>

    <!-- 账号与订阅 -->
    <div class="px-6 grp" style="margin-top:10px;">
      <div class="card-elevated flex items-center gap-3 p-3.5 cursor-pointer">
        <div class="ib ib-44"><i class="fa-solid fa-user"></i></div>
        <div class="flex-1">
          <p class="text-[15px] font-bold">syy</p>
          <p class="text-[11px] t-3 mt-0.5">免费版 · AI 降噪今日剩余 3 次</p>
        </div>
        <span class="text-[12px] font-bold t-brand"><i class="fa-solid fa-crown mr-1"></i>升级 Pro</span>
      </div>
    </div>

    <!-- 默认设置（入口收敛 → 二级页） -->
    <div class="px-6 grp">
      <p class="section-label mb-2 px-1">默认设置</p>
      <div class="card overflow-hidden">
        <div class="list-row" onclick="location.href='settings-defaults.html'">
          <div class="ib ib-28"><i class="fa-solid fa-microphone"></i></div>
          <span class="text-[13px] font-medium t-2 flex-1">录音参数</span>
          <span class="mono text-[11px] t-3">48kHz·24bit·立体声</span>
          <i class="fa-solid fa-chevron-right chev"></i>
        </div>
        <div class="divider mx-4"></div>
        <div class="list-row" onclick="location.href='settings-defaults.html'">
          <div class="ib ib-28"><i class="fa-solid fa-file-export"></i></div>
          <span class="text-[13px] font-medium t-2 flex-1">导出参数</span>
          <span class="mono text-[11px] t-3">WAV·320kbps</span>
          <i class="fa-solid fa-chevron-right chev"></i>
        </div>
      </div>
    </div>

    <!-- 外观 -->
    <div class="px-6 grp">
      <p class="section-label mb-2 px-1">外观</p>
      <div class="card overflow-hidden">
        <div class="list-row">
          <div class="ib ib-28"><i class="fa-solid fa-palette"></i></div>
          <span class="text-[13px] font-medium t-2 flex-1">主题</span>
          <span class="text-[12px] t-3">深色</span>
          <i class="fa-solid fa-chevron-right chev"></i>
        </div>
        <div class="divider mx-4"></div>
        <div class="list-row">
          <div class="ib ib-28"><i class="fa-solid fa-wave-square"></i></div>
          <span class="text-[13px] font-medium t-2 flex-1">波形配色</span>
          <span class="text-[12px] t-3">品牌蓝</span>
          <i class="fa-solid fa-chevron-right chev"></i>
        </div>
      </div>
    </div>

    <!-- 通用 -->
    <div class="px-6 grp">
      <p class="section-label mb-2 px-1">通用</p>
      <div class="card overflow-hidden">
        <div class="list-row">
          <div class="ib ib-28"><i class="fa-solid fa-cloud"></i></div>
          <span class="text-[13px] font-medium t-2 flex-1">iCloud 同步</span>
          <div class="toggle"></div>
        </div>
        <div class="divider mx-4"></div>
        <div class="list-row">
          <div class="ib ib-28"><i class="fa-solid fa-database"></i></div>
          <span class="text-[13px] font-medium t-2 flex-1">清除缓存</span>
          <span class="mono text-[12px] t-3">1.2 GB</span>
          <i class="fa-solid fa-chevron-right chev"></i>
        </div>
        <div class="divider mx-4"></div>
        <div class="list-row">
          <div class="ib ib-28"><i class="fa-solid fa-globe"></i></div>
          <span class="text-[13px] font-medium t-2 flex-1">语言</span>
          <span class="text-[12px] t-3">跟随系统</span>
          <i class="fa-solid fa-chevron-right chev"></i>
        </div>
      </div>
    </div>

    <!-- 帮助与支持 -->
    <div class="px-6 grp">
      <p class="section-label mb-2 px-1">帮助与支持</p>
      <div class="card overflow-hidden">
        <div class="list-row" onclick="location.href='settings-help.html'">
          <div class="ib ib-28"><i class="fa-solid fa-circle-question"></i></div>
          <div class="flex-1">
            <p class="text-[13px] font-medium t-2">帮助与反馈</p>
            <p class="text-[10px] t-4 mt-0.5">教程 · 反馈建议 · 评分</p>
          </div>
          <i class="fa-solid fa-chevron-right chev"></i>
        </div>
        <div class="divider mx-4"></div>
        <div class="list-row" onclick="location.href='settings-legal.html'">
          <div class="ib ib-28"><i class="fa-solid fa-shield-halved"></i></div>
          <span class="text-[13px] font-medium t-2 flex-1">隐私与条款</span>
          <i class="fa-solid fa-chevron-right chev"></i>
        </div>
      </div>
    </div>

    <p class="text-center text-[10px] t-4" style="margin-top:6px;">ReWave v1.0.0 · © 2025 ReWave Studio</p>
  </div>

  <div class="tab-bar">
    <div class="tab-item"><i class="fa-solid fa-house"></i><span>首页</span></div>
    <div class="tab-item"><i class="fa-solid fa-scissors"></i><span>编辑</span></div>
    <div class="tab-item"><i class="fa-solid fa-shuffle"></i><span>转换</span></div>
    <div class="tab-item active"><i class="fa-solid fa-gear"></i><span>设置</span></div>
  </div>
  <div class="home-indicator"></div>
</div>
<script src="assets/common.js"></script>
</body>
</html>
