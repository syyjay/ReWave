<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-005 · 转换中心 - ReWave</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@200;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="phone">
  <div class="dynamic-island"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="sb-right">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <span class="battery"><b></b></span>
    </div>
  </div>

  <div class="scroll pb-4">
    <div class="page-head">
      <h1 class="page-title">转换中心</h1>
      <span class="chip chip-gray mono"><i class="fa-solid fa-clock"></i>本月 38 次</span>
    </div>

    <!-- 9 宫格工具 -->
    <div class="px-6 mt-5 grid grid-cols-3 gap-x-3 gap-y-5">
      <div class="flex flex-col items-center gap-2 cursor-pointer">
        <div class="ib ib-48"><i class="fa-solid fa-shuffle"></i></div>
        <span class="text-[11px] font-medium t-2">格式转换</span>
      </div>
      <div class="flex flex-col items-center gap-2 cursor-pointer">
        <div class="ib ib-48 g-batch"><i class="fa-solid fa-layer-group"></i></div>
        <span class="text-[11px] font-medium t-2 whitespace-nowrap">批量转换 <span class="pro-badge">PRO</span></span>
      </div>
      <div class="flex flex-col items-center gap-2 cursor-pointer">
        <div class="ib ib-48 g-compress"><i class="fa-solid fa-compress"></i></div>
        <span class="text-[11px] font-medium t-2">音频压缩</span>
      </div>
      <div class="flex flex-col items-center gap-2 cursor-pointer">
        <div class="ib ib-48 g-merge"><i class="fa-solid fa-link"></i></div>
        <span class="text-[11px] font-medium t-2">音频合并</span>
      </div>
      <div class="flex flex-col items-center gap-2 cursor-pointer">
        <div class="ib ib-48 g-separate"><i class="fa-solid fa-scissors"></i></div>
        <span class="text-[11px] font-medium t-2">音频分割</span>
      </div>
      <div class="flex flex-col items-center gap-2 cursor-pointer">
        <div class="ib ib-48"><i class="fa-solid fa-film"></i></div>
        <span class="text-[11px] font-medium t-2">视频提取</span>
      </div>
      <div class="flex flex-col items-center gap-2 cursor-pointer">
        <div class="ib ib-48 g-ringtone"><i class="fa-solid fa-bell"></i></div>
        <span class="text-[11px] font-medium t-2">铃声制作</span>
      </div>
      <div class="flex flex-col items-center gap-2 cursor-pointer">
        <div class="ib ib-48 g-meta"><i class="fa-solid fa-tags"></i></div>
        <span class="text-[11px] font-medium t-2 whitespace-nowrap">元数据 <span class="pro-badge">PRO</span></span>
      </div>
      <div class="flex flex-col items-center gap-2 cursor-pointer">
        <div class="ib ib-48 g-info"><i class="fa-solid fa-circle-info"></i></div>
        <span class="text-[11px] font-medium t-2">文件信息</span>
      </div>
    </div>

    <!-- 转换历史 -->
    <div class="px-6 mt-7">
      <div class="flex items-center justify-between mb-3">
        <span class="section-label">转换历史</span>
        <span class="text-[12px] t-brand font-medium cursor-pointer">清空记录</span>
      </div>
      <div class="card overflow-hidden">
        <div class="list-row">
          <div class="ib ib-40 g-batch"><i class="fa-solid fa-layer-group"></i></div>
          <div class="flex-1 min-w-0">
            <p class="text-[13px] font-semibold truncate">播客素材包 · 批量转换</p>
            <p class="mono mt-0.5 text-[10px] t-3">12 个文件 · WAV → MP3 · 320kbps</p>
          </div>
          <div class="flex flex-col items-end gap-1">
            <span class="chip chip-done"><i class="fa-solid fa-circle-check"></i>完成</span>
            <span class="mono text-[9px] t-4">今天 09:12</span>
          </div>
        </div>
        <div class="divider mx-4"></div>
        <div class="list-row">
          <div class="ib ib-40 g-compress"><i class="fa-solid fa-compress"></i></div>
          <div class="flex-1 min-w-0">
            <p class="text-[13px] font-semibold truncate">采访 0903 · 压缩</p>
            <p class="mono mt-0.5 text-[10px] t-3">WAV → AAC · 342.8 MB → 12.1 MB</p>
          </div>
          <div class="flex flex-col items-end gap-1">
            <span class="chip chip-done"><i class="fa-solid fa-circle-check"></i>完成</span>
            <span class="mono text-[9px] t-4">昨天 22:47</span>
          </div>
        </div>
        <div class="divider mx-4"></div>
        <div class="list-row">
          <div class="ib ib-40 g-brand"><i class="fa-solid fa-shuffle"></i></div>
          <div class="flex-1 min-w-0">
            <p class="text-[13px] font-semibold truncate">BGM 素材 → FLAC</p>
            <p class="mono mt-0.5 text-[10px] t-3">MP3 → FLAC · 无损导出</p>
          </div>
          <div class="flex flex-col items-end gap-1">
            <span class="chip chip-info"><i class="fa-solid fa-spinner fa-spin"></i>处理中 68%</span>
            <span class="mono text-[9px] t-4">剩余约 3 秒</span>
          </div>
        </div>
        <div class="divider mx-4"></div>
        <div class="list-row">
          <div class="ib ib-40 g-separate"><i class="fa-solid fa-user-slash"></i></div>
          <div class="flex-1 min-w-0">
            <p class="text-[13px] font-semibold truncate">流行单曲 · 人声分离</p>
            <p class="mono mt-0.5 text-[10px] t-3">提取伴奏 · 高质量模式</p>
          </div>
          <div class="flex flex-col items-end gap-1">
            <span class="chip chip-err"><i class="fa-solid fa-circle-exclamation"></i>失败</span>
            <span class="mono text-[9px] t-4">9月8日</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item"><i class="fa-solid fa-house"></i><span>首页</span></div>
    <div class="tab-item"><i class="fa-solid fa-scissors"></i><span>编辑</span></div>
    <div class="tab-item active"><i class="fa-solid fa-shuffle"></i><span>转换</span></div>
    <div class="tab-item"><i class="fa-solid fa-gear"></i><span>设置</span></div>
  </div>
  <div class="home-indicator"></div>
</div>
<script src="assets/common.js"></script>
</body>
</html>
