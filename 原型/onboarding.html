<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-001 · 新手引导 - ReWave</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/common.css?v=2">
<style>
  .glow {
    position: absolute; top: -120px; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(124,58,237,0.22) 0%, rgba(79,107,255,0.10) 45%, transparent 70%);
    pointer-events: none;
    transition: opacity .4s ease;
  }
  .page-dot { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.2); cursor: pointer; transition: all .3s ease; }
  .page-dot.active { width: 20px; background: var(--rw-primary-gradient); }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 40px;
    opacity: 0; transform: translateX(24px);
    pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
  }
  .slide.left { transform: translateX(-24px); }
  .slide.cur { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .size-chip {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 10px 14px; border-radius: 12px;
    background: var(--rw-surface-1);
    border: 1px solid var(--rw-border-default);
  }
  .fmt-chip {
    padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700;
    background: var(--rw-surface-1); border: 1px solid var(--rw-border-default);
    color: var(--rw-text-tertiary);
  }
  .fmt-chip.hl { background: rgba(79,107,255,0.15); border-color: var(--rw-border-brand); color: var(--rw-primary); }
</style>
</head>
<body>
<div class="phone">
  <div class="glow"></div>
  <div class="dynamic-island"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="sb-right">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <span class="battery"><b></b></span>
    </div>
  </div>

  <!-- 顶部跳过 -->
  <div class="flex justify-end px-6 pt-2 no-shrink relative z-10">
    <span class="text-[13px] t-3 cursor-pointer" onclick="location.href='home.html'">跳过</span>
  </div>

  <!-- 三页轮播 -->
  <div class="flex-1 relative min-h-0">
    <!-- 第 1 页 · 精准音频编辑 -->
    <div class="slide cur" data-page="0">
      <div class="ib g-brand" style="width:88px;height:88px;border-radius:28px;box-shadow:var(--rw-shadow-brand-strong);">
        <i class="fa-solid fa-wave-square" style="font-size:36px;"></i>
      </div>
      <h1 class="mt-8 text-[28px] font-extrabold tracking-tight">精准音频编辑</h1>
      <p class="mt-3 text-center text-[16px] leading-relaxed t-2">
        可视化波形，毫秒级剪辑。<br>裁剪、淡入淡出、多轨混音，像剪视频一样简单。
      </p>
      <div class="mt-9 w-full max-w-[280px]">
        <div class="rounded-[12px] overflow-hidden relative" style="height:56px;background:var(--rw-surface-1);border:1px solid var(--rw-border-default);">
          <div class="wave px-2" data-seed="42" data-bars="52" style="color:var(--rw-primary-300);"></div>
          <div class="wave-selection" style="left:24%;width:34%;"></div>
          <div class="wave-handle" style="left:calc(24% - 5px);"></div>
          <div class="wave-handle" style="left:calc(58% - 5px);"></div>
          <div class="playhead" style="left:40%;"></div>
        </div>
        <p class="mono text-center text-[10px] t-4 mt-2.5">00:04:51 / 00:12:47 · 选区 03:12</p>
      </div>
    </div>

    <!-- 第 2 页 · 全格式极速转换 -->
    <div class="slide left" data-page="1">
      <div class="ib g-brand" style="width:88px;height:88px;border-radius:28px;box-shadow:var(--rw-shadow-brand-strong);">
        <i class="fa-solid fa-shuffle" style="font-size:34px;"></i>
      </div>
      <h1 class="mt-8 text-[28px] font-extrabold tracking-tight">全格式极速转换</h1>
      <p class="mt-3 text-center text-[16px] leading-relaxed t-2">
        MP3、WAV、FLAC 等 11 种格式互转，<br>5 分钟音频 5 秒完成。
      </p>
      <div class="mt-9 flex flex-wrap justify-center gap-2 max-w-[280px]">
        <span class="fmt-chip hl">MP3</span><span class="fmt-chip">WAV</span><span class="fmt-chip">AAC</span>
        <span class="fmt-chip">M4A</span><span class="fmt-chip">OGG</span><span class="fmt-chip">FLAC</span>
        <span class="fmt-chip">AIFF</span><span class="fmt-chip">OPUS</span>
        <span class="fmt-chip">+3</span>
      </div>
    </div>

    <!-- 第 3 页 · 智能压缩与处理 -->
    <div class="slide left" data-page="2">
      <div class="ib g-brand" style="width:88px;height:88px;border-radius:28px;box-shadow:var(--rw-shadow-brand-strong);">
        <i class="fa-solid fa-bolt" style="font-size:38px;"></i>
      </div>
      <h1 class="mt-8 text-[28px] font-extrabold tracking-tight">智能压缩与处理</h1>
      <p class="mt-3 text-center text-[16px] leading-relaxed t-2">
        AI 一键降噪、人声伴奏分离，一次批量处理 100+ 文件。<br>在体积与音质之间找到完美平衡。
      </p>
      <div class="mt-9 flex items-center gap-4">
        <div class="size-chip">
          <div class="wave" data-seed="21" data-bars="14" style="width:64px;height:26px;color:var(--rw-text-tertiary);"></div>
          <span class="mono text-[11px] t-3">342 MB</span>
        </div>
        <div class="ib ib-34"><i class="fa-solid fa-compress"></i></div>
        <div class="size-chip" style="border-color:var(--rw-border-brand);">
          <div class="wave" data-seed="21" data-bars="6" style="width:26px;height:26px;color:var(--rw-primary-300);"></div>
          <span class="mono text-[11px] t-brand">12 MB</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部：指示器 + CTA -->
  <div class="no-shrink px-6 pb-9 relative z-10">
    <div class="flex justify-center gap-2 mb-7" id="dots">
      <span class="page-dot active" data-go="0"></span>
      <span class="page-dot" data-go="1"></span>
      <span class="page-dot" data-go="2"></span>
    </div>
    <button class="btn btn-primary w-full" id="nextBtn">继续</button>
    <p class="mt-4 text-center text-[11px] t-4">
      <i class="fa-solid fa-shield-halved mr-1"></i>首次使用将请求「麦克风」与「文件」访问权限
    </p>
  </div>

  <div class="home-indicator"></div>
</div>

<script>
  var cur = 0;
  var slides = document.querySelectorAll('.slide');
  var dots = document.querySelectorAll('.page-dot');
  var nextBtn = document.getElementById('nextBtn');

  function go(n) {
    cur = Math.max(0, Math.min(2, n));
    slides.forEach(function (s, i) {
      s.classList.toggle('cur', i === cur);
      s.classList.toggle('left', i < cur);
    });
    dots.forEach(function (d, i) { d.classList.toggle('active', i === cur); });
    nextBtn.textContent = cur === 2 ? '开始使用' : '继续';
  }

  dots.forEach(function (d) { d.addEventListener('click', function () { go(+d.dataset.go); }); });
  nextBtn.addEventListener('click', function () {
    if (cur === 2) { location.href = 'home.html'; } else { go(cur + 1); }
  });
</script>
<script src="assets/common.js?v=2"></script>
</body>
</html>
