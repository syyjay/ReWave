<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P-001 · 新手引导 - ReWave</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@200;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>
  .glow {
    position: absolute; top: -120px; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(124,58,237,0.22) 0%, rgba(79,107,255,0.10) 45%, transparent 70%);
    pointer-events: none;
  }
  .page-dot { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.2); }
  .page-dot.active { width: 20px; background: var(--rw-primary-gradient); }
  .size-chip {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding: 10px 14px; border-radius: 12px;
    background: var(--rw-surface-1);
    border: 1px solid var(--rw-border-default);
  }
</style>
</head>
<body>
<div class="phone">
  <div class="glow"></div>
  <div class="dynamic-island"></div>

  <div class="status-bar">
    <span>9:41</span>
    <div class="sb-right">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <span class="battery"><b></b></span>
    </div>
  </div>

  <!-- 顶部跳过 -->
  <div class="flex justify-end px-6 pt-2 no-shrink">
    <span class="text-[13px] t-3 cursor-pointer">跳过</span>
  </div>

  <!-- 主体：第 3 页 -->
  <div class="flex-1 flex flex-col items-center justify-center px-10 relative">
    <!-- 主图标 -->
    <div class="ib g-brand" style="width:88px;height:88px;border-radius:28px;box-shadow:var(--rw-shadow-brand-strong);">
      <i class="fa-solid fa-bolt" style="font-size:38px;"></i>
    </div>

    <h1 class="mt-8 text-[28px] font-extrabold tracking-tight">智能压缩与处理</h1>
    <p class="mt-3 text-center text-[16px] leading-relaxed t-2">
      AI 一键降噪、人声伴奏分离，一次批量处理 100+ 文件。<br>在体积与音质之间找到完美平衡。
    </p>

    <!-- 压缩示意 -->
    <div class="mt-9 flex items-center gap-4">
      <div class="size-chip">
        <div class="wave" data-seed="21" data-bars="14" style="width:64px;height:26px;color:var(--rw-text-tertiary);"></div>
        <span class="mono text-[11px] t-3">342 MB</span>
      </div>
      <div class="ib g-compress ib-34"><i class="fa-solid fa-compress"></i></div>
      <div class="size-chip" style="border-color:var(--rw-border-brand);">
        <div class="wave" data-seed="21" data-bars="6" style="width:26px;height:26px;color:var(--rw-primary-300);"></div>
        <span class="mono text-[11px] t-brand">12 MB</span>
      </div>
    </div>
  </div>

  <!-- 底部：指示器 + CTA -->
  <div class="no-shrink px-6 pb-9">
    <div class="flex justify-center gap-2 mb-7">
      <span class="page-dot"></span>
      <span class="page-dot"></span>
      <span class="page-dot active"></span>
    </div>
    <button class="btn btn-primary w-full">开始使用</button>
    <p class="mt-4 text-center text-[11px] t-4">
      <i class="fa-solid fa-shield-halved mr-1"></i>首次使用将请求「麦克风」与「文件」访问权限
    </p>
  </div>

  <div class="home-indicator"></div>
</div>
<script src="assets/common.js"></script>
</body>
</html>
